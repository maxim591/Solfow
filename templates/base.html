<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Solfow{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23059669'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=General+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ---- Palette: ein Akzent, kein Dekor-Grün als Variable ---- */
      --bg:            oklch(0.99 0 0);
      --surface:       oklch(1 0 0);
      --border:        oklch(0.90 0.005 260);
      --border-strong: oklch(0.82 0.008 260);
      --ink:           oklch(0.20 0.01 260);
      --muted:         oklch(0.50 0.01 260);   /* ~4.6:1 auf --bg */
      --faint:         oklch(0.62 0.01 260);   /* nur für Meta, nie für Fließtext */
      --accent:        oklch(0.55 0.17 255);
      --accent-hover:  oklch(0.48 0.17 255);
      --live:          oklch(0.70 0.18 155);   /* nur Status/Ticker */
      --danger:        oklch(0.60 0.20 25);
      --warn:          oklch(0.72 0.16 70);

      /* Aliase für Altcode, damit bestehende Templates nicht brechen */
      --text:           var(--ink);
      --text-secondary: var(--muted);
      --text-tertiary:  var(--faint);
      --green:          var(--live);
      --blue:           var(--accent);
      --red:            var(--danger);
      --amber:          var(--warn);

      --radius:    10px;
      --radius-sm: 8px;

      /* ---- Type ---- */
      --font-display: "General Sans", "Untitled Sans", "Söhne", sans-serif;
      --font-body:    "General Sans", "Untitled Sans", "Söhne", sans-serif;
      --font-mono:    "JetBrains Mono", "Berkeley Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    html { font-size: 16px; -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, textarea { font-family: inherit; }

    ::selection { background: var(--accent); color: #fff; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 600;
      color: var(--ink);
    }

    .mono { font-family: var(--font-mono); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    /* Shared brand dot — Status-Punkt, kein Dekor */
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--live);
      flex-shrink: 0;
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
